# IPv6-only ESP8266 test. Needs wifi_ssid, wifi_password, ota_password in secrets.yaml.
# Set `board` to match the device (esp01_1m = generic 1 MB module).
esphome:
  name: esp8266-v6-test

esp8266:
  board: esp01_1m

external_components:
  - source:
      type: local
      path: components
    components: [wifi, wifi_info, sntp]

network:
  enable_ipv6: true
  min_ipv6_addr_count: 2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ipv6_only: true
  ap:
    ssid: fallback
    password: fallbackpass

logger:
  level: DEBUG
api:
ota:
  - platform: esphome
    password: !secret ota_password
