# Ethernet variant of the compile test: Olimex ESP32-POE-ISO (LAN8720), IPv6-only.
esphome:
  name: ipv6-only-eth-compile-test

esp32:
  board: esp32-poe-iso
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components: [ethernet, ethernet_info, sntp, gateway_watchdog]

network:
  enable_ipv6: true
  min_ipv6_addr_count: 2

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO17
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12
  ipv6_only: true

logger:
api:
ota:
  - platform: esphome

time:
  - platform: sntp
    servers: [2.pool.ntp.org, "2001:db8:1::1"]

gateway_watchdog:
  id: gw_wd
  reboot: false

sensor:
  - platform: gateway_watchdog
    gateway_watchdog_id: gw_wd
    packet_loss:
      name: Gateway packet loss

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: IP address
      ignore_link_local: true
